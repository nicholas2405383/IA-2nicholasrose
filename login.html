<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | Coding Conference 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata" rel="stylesheet">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img src="assets/logo.svg" alt="" width="36" height="36">
      <span>Coding Conference 2026</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="login.html">Register</a>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <h1>Register for Coding Conf 2026</h1>
      <p class="signed-up">Already registered? <a class="button button--outline button--small" href="ticket.html">View my ticket</a></p>
      <!-- Registration form, checked by validation.js -->
      <form id="register-form" class="glass" novalidate>
        <div class="field">
          <label for="avatar">Upload your pic!</label>
          <div class="dropzone" id="dropzone">
            <input type="file" id="avatar" accept="image/png, image/jpeg" aria-describedby="avatar-error">
            <span class="drop-title" id="drop-title">Drop here</span>
            <span class="drop-hint">or click to choose a JPG or PNG, up to 500 KB</span>
          </div>
          <p class="error" id="avatar-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="full-name">Full name</label>
          <input type="text" id="full-name" autocomplete="name" aria-describedby="full-name-error">
          <p class="error" id="full-name-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" aria-describedby="email-error">
          <p class="error" id="email-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="github">GitHub user</label>
          <input type="text" id="github" autocomplete="off" placeholder="@username" aria-describedby="github-error">
          <p class="error" id="github-error" aria-live="polite"></p>
        </div>
        <button type="submit" class="button">Submit</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; Nicholas Rose</p>
  </footer>
  <!-- Checks the form and saves the data -->
  <script src="js/validation.js"></script>
</body>
</html>
