
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Code Conference 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img src="assets/logo.svg" alt="" width="32" height="32">
      <span>code conference</span>
    </a>

    <nav aria-label="Main">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html" aria-current="page">Register</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <h1>Get your ticket</h1>
      <p class="lead">Fill in your details and we'll generate your ticket.</p>

      <form id="register-form" class="glass" novalidate>

        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name"
                 autocomplete="name"
                 aria-describedby="name-error">
          <p class="error" id="name-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email"
                 autocomplete="email"
                 aria-describedby="email-error">
          <p class="error" id="email-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="github">GitHub username</label>
          <input type="text" id="github" name="github"
                 placeholder="@username"
                 autocomplete="off"
                 aria-describedby="github-error">
          <p class="error" id="github-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="avatar">Profile photo (JPG or PNG, up to 500 KB)</label>
          <input type="file" id="avatar" name="avatar"
                 accept="image/png, image/jpeg"
                 aria-describedby="avatar-error">
          <p class="error" id="avatar-error" aria-live="polite"></p>
        </div>

        <button type="submit" class="button">
          Generate my ticket
        </button>

      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>Code Conference 2026</p>
  </footer>

  <script src="validation.js"></script>
</body>
</html>
